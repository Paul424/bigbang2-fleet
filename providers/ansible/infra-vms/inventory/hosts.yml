---
all:
  children:
    # Proxmox-nodes: hier wordt via SSH het cloud-init template aangemaakt.
    proxmox:
      hosts:
        p1:
          ansible_host: 192.168.50.170
          pve_template_vmid: 9000
        p2:
          ansible_host: 192.168.50.171
          pve_template_vmid: 9001
        p3:
          ansible_host: 192.168.50.172
          pve_template_vmid: 9002
      vars:
        ansible_user: root

    # Infra-VM's buiten de clusters. Provisioning gaat via de Proxmox-API
    # (delegate_to: localhost); ansible_host is het IP dat de VM krijgt.
    infra_vms:
      children:
        dns:
          hosts:
            dns1:
            dns2:
        pki:
          hosts:
            step-ca:

    # Talos-clusters (VM's boot van de Talos-ISO; zie docs/IPAM.md voor adressen)
    cluster_vms:
      children:
        mgmt:
          hosts:
            mgmt-cp1: { vm_id: 401, vm_node: p1, ansible_host: 192.168.49.10 }
            mgmt-cp2: { vm_id: 402, vm_node: p2, ansible_host: 192.168.49.11 }
            mgmt-cp3: { vm_id: 403, vm_node: p3, ansible_host: 192.168.49.12 }
