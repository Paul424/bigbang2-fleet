---
- name: Verplichte variabelen controleren
  ansible.builtin.assert:
    that:
      - vm_id is defined
      - vm_node is defined
      - ansible_host is defined
    fail_msg: "Zet vm_id, vm_node en ansible_host in host_vars/{{ inventory_hostname }}.yml"

- name: Proxmox API-taken
  module_defaults:
    community.proxmox.proxmox_kvm: &auth
      api_host: "{{ proxmox_api_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_token_id: "{{ proxmox_api_token_id }}"
      api_token_secret: "{{ proxmox_api_token_secret }}"
      validate_certs: "{{ proxmox_validate_certs }}"
    community.proxmox.proxmox_disk: *auth
  block:
    - name: Verwijderen
      when: vm_state == 'absent'
      delegate_to: localhost
      block:
        - name: VM stoppen
          community.proxmox.proxmox_kvm:
            node: "{{ vm_node }}"
            vmid: "{{ vm_id }}"
            state: stopped
            force: true
          failed_when: false

        - name: VM verwijderen
          community.proxmox.proxmox_kvm:
            node: "{{ vm_node }}"
            vmid: "{{ vm_id }}"
            state: absent

    - name: Aanmaken / bijwerken
      when: vm_state != 'absent'
      delegate_to: localhost
      block:
        - name: Clone van template {{ vm_template_vmid }}
          when: vm_iso | length == 0
          community.proxmox.proxmox_kvm:
            node: "{{ vm_template_node }}"
            vmid: "{{ vm_template_vmid }}"
            clone: template          # willekeurige waarde; bron is vmid
            # Template staat per node (local-lvm is niet gedeeld), dus geen target nodig.
            newid: "{{ vm_id }}"
            name: "{{ vm_name }}"
            full: true
            storage: "{{ vm_storage }}"
            format: unspecified
            timeout: 600
          register: _clone

        - name: Lege VM aanmaken die boot van {{ vm_iso }}
          when: vm_iso | length > 0
          community.proxmox.proxmox_kvm:
            node: "{{ vm_node }}"
            vmid: "{{ vm_id }}"
            name: "{{ vm_name }}"
            ostype: l26
            machine: q35
            bios: seabios
            cpu: "{{ vm_cpu }}"
            numa_enabled: false
            scsihw: virtio-scsi-pci
            scsi:
              scsi0: "{{ vm_storage }}:{{ vm_disk_size | regex_replace('[Gg]$', '') }},discard=on,ssd=1"
            ide:
              ide0: "{{ vm_storage }}:cloudinit"
              ide2: "{{ vm_iso }},media=cdrom"
            # Lege disk eerst; na installatie boot Talos van disk, anders van de ISO
            boot: "order=scsi0;ide2"
            agent: "enabled=1"
            state: present

        - name: Hardware en cloud-init configureren
          community.proxmox.proxmox_kvm:
            node: "{{ vm_node }}"
            vmid: "{{ vm_id }}"
            update: true
            update_unsafe: true
            cores: "{{ vm_cores }}"
            sockets: "{{ vm_sockets }}"
            memory: "{{ vm_memory }}"
            onboot: "{{ vm_onboot }}"
            tags: "{{ vm_tags }}"
            net:
              net0: "virtio={{ vm_mac }},bridge={{ vm_bridge }}{{ (',tag=' ~ vm_vlan) if vm_vlan | string | length > 0 else '' }}"
            ipconfig:
              ipconfig0: "ip={{ vm_ip }}/{{ vm_netmask }},gw={{ vm_gateway }}"
            nameservers: "{{ vm_nameservers }}"
            searchdomains: "{{ vm_searchdomain }}"
            ciuser: "{{ vm_ci_user }}"
            sshkeys: "{{ vm_ssh_public_keys | join('\n') }}"

        - name: Disk vergroten naar {{ vm_disk_size }}
          community.proxmox.proxmox_disk:
            vmid: "{{ vm_id }}"
            disk: "{{ vm_disk }}"
            size: "{{ vm_disk_size }}"
            state: resized

        - name: Extra disks
          community.proxmox.proxmox_disk:
            vmid: "{{ vm_id }}"
            disk: "{{ item.disk }}"
            storage: "{{ item.storage }}"
            size: "{{ item.size }}"
            discard: "on"
            ssd: true
            backup: false          # geen vzdump van Ceph-data
            state: present
          loop: "{{ vm_extra_disks }}"
          loop_control:
            label: "{{ item.disk }} {{ item.storage }}:{{ item.size }}G"

        - name: VM starten
          community.proxmox.proxmox_kvm:
            node: "{{ vm_node }}"
            vmid: "{{ vm_id }}"
            state: started
          when: vm_state == 'started'

    - name: Wachten op poort {{ vm_wait_port }}
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ vm_wait_port }}"
        timeout: 300
        search_regex: "{{ 'OpenSSH' if vm_wait_port | int == 22 else omit }}"
      delegate_to: localhost
      when:
        - vm_state == 'started'
        - vm_wait_for_ssh | bool

    # rc 0 = ok, rc 1 = fout, rc 2 = klaar met recoverable errors/warnings
    - name: Wachten tot cloud-init klaar is
      ansible.builtin.command: cloud-init status --wait --long
      register: _cloud_init
      changed_when: false
      failed_when: _cloud_init.rc not in [0, 2]
      when:
        - vm_state == 'started'
        - vm_wait_for_ssh | bool
        - vm_wait_for_cloud_init | bool

    - name: cloud-init waarschuwingen
      ansible.builtin.debug:
        msg: "{{ _cloud_init.stdout_lines }}"
      when:
        - _cloud_init is not skipped
        - _cloud_init.rc == 2
