---
# Verplicht per host: vm_id, vm_node, ansible_host
vm_name: "{{ inventory_hostname }}"
vm_template_vmid: "{{ hostvars[vm_node].pve_template_vmid }}"
vm_template_node: "{{ vm_node }}"

# Bron: leeg = clone van het cloud-init template; anders een ISO om van te
# booten (bv. Talos), dan wordt een lege VM met disk + cloud-init drive gemaakt.
vm_iso: ""
vm_cpu: x86-64-v3          # alleen bij vm_iso; clones erven 'host' van het template

vm_cores: 2
vm_sockets: 1
vm_memory: 2048
vm_disk: scsi0
vm_disk_size: 20G
vm_storage: local-lvm
vm_onboot: true
# Extra disks, bv. ruwe disks voor Ceph-OSD's:
#   - { disk: scsi1, storage: data, size: 400 }   # size in GB
vm_extra_disks: []
vm_tags: []

vm_bridge: "{{ lab_bridge }}"
vm_vlan: "{{ lab_vlan | default('') }}"
# Vast MAC-adres, afgeleid van vm_id (BC:24:11 = Proxmox-prefix). Zonder vast MAC
# genereert Proxmox bij elke update van net0 een nieuw MAC en raakt de VM zijn
# cloud-init netwerkconfig (die op MAC matcht) kwijt.
vm_mac: >-
  {{ 'BC:24:11:%02X:%02X:%02X' | format(
       (vm_id | int // 65536) % 256,
       (vm_id | int // 256) % 256,
       vm_id | int % 256) }}
vm_ip: "{{ ansible_host }}"
vm_netmask: "{{ lab_netmask }}"
vm_gateway: "{{ lab_gateway }}"
vm_nameservers: "{{ lab_nameservers }}"
vm_searchdomain: "{{ lab_domain }}"

vm_ci_user: ansible
vm_ssh_public_keys: []

vm_state: started          # started | present | absent
vm_wait_for_ssh: true      # wachten tot vm_wait_port open is
vm_wait_port: 22           # Talos maintenance mode: 50000
vm_wait_for_cloud_init: "{{ vm_wait_port | int == 22 }}"

