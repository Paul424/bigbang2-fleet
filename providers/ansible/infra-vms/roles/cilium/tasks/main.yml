---
# Draait één keer op de controller, na talos_cluster.
- name: Cilium op {{ talos_cluster_name }}
  run_once: true
  delegate_to: localhost
  become: false
  module_defaults:
    kubernetes.core.helm:
      kubeconfig: "{{ cilium_kubeconfig }}"
    kubernetes.core.k8s:
      kubeconfig: "{{ cilium_kubeconfig }}"
    kubernetes.core.k8s_info:
      kubeconfig: "{{ cilium_kubeconfig }}"
  vars:
    _nodes: "{{ ansible_play_hosts_all }}"
    _cp_ips: "{{ _nodes | map('extract', hostvars) | selectattr('talos_role', 'equalto', 'controlplane') | map(attribute='ansible_host') | list }}"
    _worker_ips: "{{ _nodes | map('extract', hostvars) | rejectattr('talos_role', 'equalto', 'controlplane') | map(attribute='ansible_host') | list }}"
  block:
    - name: Helm-values
      ansible.builtin.set_fact:
        _cilium_values: "{{ lookup('ansible.builtin.template', 'values.yaml.j2') | from_yaml | combine(cilium_extra_values, recursive=true) }}"

    # Precies dit bestand gaat naar Helm; handig om te zien welke config gebruikt wordt
    - name: Helm-values wegschrijven naar {{ cilium_values_file }}
      ansible.builtin.copy:
        content: "{{ _cilium_values | to_nice_yaml(indent=2) }}"
        dest: "{{ cilium_values_file }}"
        mode: "0600"

    - name: Cilium installeren / upgraden
      kubernetes.core.helm:
        name: "{{ cilium_release }}"
        release_namespace: "{{ cilium_namespace }}"
        chart_repo_url: "{{ cilium_chart_repo }}"
        chart_ref: cilium
        chart_version: "{{ cilium_version }}"
        values_files:
          - "{{ cilium_values_file }}"
        wait: true
        wait_timeout: 10m

    - name: Wachten op de Cilium-CRD's
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: "{{ item }}"
      register: _crd
      until: _crd.resources | length > 0
      retries: 30
      delay: 5
      loop:
        - ciliumloadbalancerippools.cilium.io
        - ciliuml2announcementpolicies.cilium.io

    - name: LoadBalancer-pool en L2-announcement
      kubernetes.core.k8s:
        state: present
        definition:
          - apiVersion: cilium.io/v2alpha1
            kind: CiliumLoadBalancerIPPool
            metadata:
              name: "{{ talos_cluster_name }}"
            spec:
              blocks:
                - start: "{{ cilium_lb_pool.start }}"
                  stop: "{{ cilium_lb_pool.stop }}"
          - apiVersion: cilium.io/v2alpha1
            kind: CiliumL2AnnouncementPolicy
            metadata:
              name: "{{ talos_cluster_name }}"
            spec:
              loadBalancerIPs: true
              externalIPs: true
              interfaces: "{{ cilium_l2_interfaces }}"

    - name: Wachten tot alle nodes Ready zijn
      kubernetes.core.k8s_info:
        kind: Node
      register: _k8s_nodes
      until: >-
        _k8s_nodes.resources | length == (_cp_ips + _worker_ips) | length
        and (_k8s_nodes.resources
             | map(attribute='status.conditions') | map('selectattr', 'type', 'equalto', 'Ready')
             | map('first') | map(attribute='status') | unique | list) == ['True']
      retries: 60
      delay: 10

    - name: talosctl health
      ansible.builtin.command:
        argv: >-
          {{ ['talosctl', '--talosconfig', cilium_talosconfig, '-n', _cp_ips[0], '-e', _cp_ips[0], 'health',
              '--wait-timeout=10m', '--control-plane-nodes=' ~ (_cp_ips | join(','))]
             + (['--worker-nodes=' ~ (_worker_ips | join(','))] if _worker_ips | length > 0 else []) }}
      changed_when: false
