# Ansible-config voor de hele repo; draai ansible vanuit de repository-root.
# Relatieve paden zijn t.o.v. dit bestand.
[defaults]
inventory = providers/ansible/infra-vms/inventory/hosts.yml
roles_path = providers/ansible/infra-vms/roles
collections_path = providers/ansible/infra-vms/collections:~/.ansible/collections
host_key_checking = False
stdout_callback = default
result_format = yaml
retry_files_enabled = False
interpreter_python = auto_silent

# Can also be done using --ask-vault-pass
vault_password_file = providers/ansible/infra-vms/.vault-pass

[ssh_connection]
pipelining = True
